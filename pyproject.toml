[project]
name = "realtime-voice-agent-platform"
version = "0.1.0"
description = "Evaluated realtime voice-agent platform with WebRTC, secure tools, and latency instrumentation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
packages = ["server.app"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
